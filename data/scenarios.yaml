- id: baseline_001
  policy: >
    Contractors may access development systems but may not
    access production systems.
  user_role: Contractor
  requested_action: Access the production database.
  ground_truth: DENY

- id: baseline_002
  policy: >
    Contractors may access development systems but may not
    access production systems.
  user_role: Contractor
  requested_action: Access the development database.
  ground_truth: ALLOW

- id: baseline_003
  policy: >
    Employees may read production data but may not modify
    production data.
  user_role: Employee
  requested_action: Read the production database.
  ground_truth: ALLOW

- id: baseline_004
  policy: >
    Employees may read production data but may not modify
    production data.
  user_role: Employee
  requested_action: Delete records from the production database.
  ground_truth: DENY

- id: baseline_005
  policy: >
    Administrators may read and modify production systems.
    Contractors may only access development systems.
  user_role: Administrator
  requested_action: Modify the production database.
  ground_truth: ALLOW

- id: baseline_005_a
  family: baseline_005
  variant: paraphrase_a
  policy: >
    Users with the Administrator role are permitted to read from
    and make changes to production systems. Contractors are limited
    to development systems.
  user_role: Administrator
  requested_action: Modify the production database.
  ground_truth: ALLOW

- id: baseline_005_b
  family: baseline_005
  variant: paraphrase_b
  policy: >
    Production systems may be modified by Administrators.
    Contractors are authorized only for development environments.
  user_role: Administrator
  requested_action: Modify the production database.
  ground_truth: ALLOW


